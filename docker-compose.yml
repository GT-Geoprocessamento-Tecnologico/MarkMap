services:
  postgres:
    image: postgis/postgis:16-3.4
    ports:
      - "${GEONEXO_LOCAL_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geonexo}
      POSTGRES_USER: postgres
      POSTGRES_DB: geonexo
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
    volumes:
      - local-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  local-db-data:
