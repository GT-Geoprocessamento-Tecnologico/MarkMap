<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07131f" />
    <!-- Site independente, sem manifest nem ícone instalável do aplicativo. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="robots" content="noindex,nofollow" />
    <meta
      name="description"
      content="MarkMap: mapeamento e coleta geoespacial offline-first para trabalho de campo."
    />
    <title>MarkMap — Planejamento Inteligente</title>
    <script>
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem("markmap-theme");
        } catch {
          saved = null;
        }
        const theme =
          saved === "light" || saved === "dark"
            ? saved
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
