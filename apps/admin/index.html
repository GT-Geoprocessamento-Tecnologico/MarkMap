<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MarkMap — Planejamento Inteligente</title>
    <meta name="application-name" content="MarkMap" />
    
    <!-- PWA Web App Manifest & iOS Native Support -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32-652c2c29.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16-652c2c29.png" />
    <meta name="theme-color" content="#07131f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MarkMap" />
    <link rel="apple-touch-icon" href="/icons/icon-180x180-652c2c29.png" />
    <meta name="format-detection" content="telephone=no">
    <!-- Apply the saved theme before React mounts to prevent a dark flash. -->
    <script>
      try {
        const light = localStorage.getItem("theme") === "light";
        document.documentElement.classList.toggle("dark", !light);
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          "content", light ? "#f4f8fb" : "#06131a"
        );
      } catch { document.documentElement.classList.add("dark"); }
    </script>
    <style>
      html,body,#root{min-height:100%;background:#f4f8fb}
      html.dark,html.dark body,html.dark #root{background:#06131a}
      body{margin:0}
    </style>


    <!--
      Shim para `Iterator`, obrigatório antes do bundle.

      O MapLibre GL 6.11.2 instala um polyfill de iterator helpers logo no topo
      do bundle:

          typeof Iterator.prototype.join != "function" &&
            (Iterator.prototype.join = function (t) { return [...this].join(t) })

      O acesso a `Iterator.prototype` é incondicional, então em qualquer
      WebView anterior ao Chrome 122 (o recurso "iterator helpers" ainda não
      existe) o bundle lança "Uncaught ReferenceError: Iterator is not defined"
      e a aplicação inteira fica em tela branca. Foi observado exatamente isso
      no emulador Android API 34.

      O shim abaixo só instala quando `Iterator` está ausente e serve apenas de
      âncora para o polyfill do MapLibre: os iteradores reais continuam sendo os
      nativos, então `[...this]` segue funcionando via `Symbol.iterator`.
    -->
    <script>
      if (typeof globalThis.Iterator === "undefined") {
        globalThis.Iterator = function Iterator() {};
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
