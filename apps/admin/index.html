<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <title>GeoNexo - Orbital Core GIS</title>
    
    <!-- PWA Web App Manifest & iOS Native Support -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#070b14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GeoNexo" />
    <link rel="apple-touch-icon" href="/icons/icon-180x180.png" />
    <meta name="format-detection" content="telephone=no">

    <link rel="preload" href="/fonts/material-symbols-outlined.woff2" as="font" type="font/woff2" crossorigin />

    <!--
      Shim para `Iterator`, obrigatório antes do bundle.

      O MapLibre GL 6.11.2 instala um polyfill de iterator helpers logo no topo
      do bundle:

          typeof Iterator.prototype.join != "function" &&
            (Iterator.prototype.join = function (t) { return [...this].join(t) })

      O acesso a `Iterator.prototype` é incondicional, então em qualquer
      WebView anterior ao Chrome 122 (o recurso "iterator helpers" ainda não
      existe) o bundle lança "Uncaught ReferenceError: Iterator is not defined"
      e a aplicação inteira fica em tela branca. Foi observado exatamente isso
      no emulador Android API 34.

      O shim abaixo só instala quando `Iterator` está ausente e serve apenas de
      âncora para o polyfill do MapLibre: os iteradores reais continuam sendo os
      nativos, então `[...this]` segue funcionando via `Symbol.iterator`.
    -->
    <script>
      if (typeof globalThis.Iterator === "undefined") {
        globalThis.Iterator = function Iterator() {};
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
