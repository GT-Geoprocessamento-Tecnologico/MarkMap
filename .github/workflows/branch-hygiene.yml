name: Branch Hygiene

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/branch-hygiene.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove consolidated branches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete obsolete remote branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in             audit/release-readiness-2026-10-02             feat/mvp-installable-webnative-gps-geopdf             release-readiness
          do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            else
              echo "Branch already absent: $branch"
            fi
          done
