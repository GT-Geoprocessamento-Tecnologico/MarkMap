name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  pwa-smoke:
    name: PWA service worker regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate service worker and shell generation
        run: node --test apps/admin/scripts/sw-update-protocol.test.mjs apps/admin/scripts/sw-navigation-cache.test.mjs apps/admin/scripts/generate-shell-manifest.test.mjs
      - name: Verify site and app boundaries
        run: node --test scripts/pwa-product-boundaries.test.mjs
      - name: Protect GeoPDF/GPS and a clean initial profile
        run: node --test scripts/gis-gps-guard.test.mjs scripts/initial-empty-contract.test.mjs
      - name: Verify theme contrast tokens
        run: node --test scripts/theme-contrast.test.mjs
      - name: Verify all app surfaces respond to the theme
        run: node --test scripts/theme-surfaces.test.mjs
