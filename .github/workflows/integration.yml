name: PostGIS Integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgis:
    name: Offline sync -> PostGIS -> pull
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: geonexo_test
          POSTGRES_PASSWORD: geonexo_test
          POSTGRES_DB: geonexo_localfirst_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geonexo_test -d geonexo_localfirst_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql://geonexo_test:geonexo_test@127.0.0.1:5432/geonexo_localfirst_test
      GEONEXO_CI_INTEGRATION: "true"
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run PostGIS integration tests
        run: pnpm --filter @geonexo/db test
