name: iOS App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "packages/**"
      - ".github/workflows/ios-app.yml"
      - "pnpm-lock.yaml"
      - "package.json"

concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build iOS debug archive
    # O projeto nativo iOS é versionado no repositório (apps/admin/ios), então o
    # CI não o regenera: só sincroniza os assets web e recompila o que está
    # commitado. Empacotar .ipa exige Xcode e Xcode só existe em macOS, por isso
    # o job roda em macos-15. Fixamos a versão do Xcode para builds determinísticos.
    runs-on: macos-15
    env:
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # A imagem macos-15 traz Xcode 16.0 a 26.3 e o symlink
      # /Applications/Xcode.app aponta para o "default" da imagem, que pode
      # mudar. Fixar uma versão concreta mantém o build determinístico; a lista
      # cobre remoções da imagem sem deixar o job quebrar por isso.
      - name: Select Xcode
        run: |
          set -euo pipefail
          echo "Xcodes presentes na imagem:"
          ls -d /Applications/Xcode*.app || echo "(nenhum Xcode encontrado)"
          selected=""
          for candidate in \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode_16.2.app \
            /Applications/Xcode_16.1.app \
            /Applications/Xcode_16.app
          do
            if [ -d "$candidate" ]; then
              selected="$candidate"
              break
            fi
          done
          if [ -z "$selected" ]; then
            echo "::warning::Nenhum Xcode 16.x na imagem; usando o default do runner."
            selected="/Applications/Xcode.app"
          fi
          sudo xcode-select -s "$selected"
          echo "Xcode selecionado: $selected"
          xcodebuild -version

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Build MarkMap web app
        run: pnpm turbo run build --filter=admin...

      # `cap sync` (copy + update) basta porque apps/admin/ios já está versionado:
      # ele copia dist/ para ios/App/App/public, regenera o Package.swift do
      # CapApp-SPM a partir dos plugins instalados e não reescreve o pbxproj.
      # `rm -rf ios` + `cap add ios` apagaria arquivos versionados e passaria a
      # compilar um projeto temporário do template em vez do projeto do repo.
      - name: Sync iOS project
        working-directory: apps/admin
        run: |
          pnpm exec cap sync ios
          node scripts/ensure-ios-location-usage.mjs

      # Sem NSLocationWhenInUseUsageDescription o iOS encerra o app assim que a
      # localização é pedida, então a ausência da chave derruba o build.
      # Também confere que o plugin de geolocalização entrou no pacote SPM.
      - name: Verify GPS wiring
        working-directory: apps/admin
        run: |
          plutil -lint ios/App/App/Info.plist
          grep -q 'NSLocationWhenInUseUsageDescription' ios/App/App/Info.plist
          grep -q 'CapacitorGeolocation' ios/App/CapApp-SPM/Package.swift

      # Diagnóstico antes de compilar: sem isto uma falha de projeto/scheme só
      # aparece como "xcodebuild: error" no meio de milhares de linhas de log.
      - name: Diagnose Xcode project
        working-directory: apps/admin/ios/App
        run: |
          xcodebuild -version
          test -d App.xcodeproj
          xcodebuild -project App.xcodeproj -list

      # Compilar pelo scheme faz o Xcode respeitar o grafo SwiftPM completo.
      # Não force SYMROOT: pacotes Swift locais resolvem esse caminho relativo
      # às próprias raízes e acabam espalhando os produtos, o que impede o
      # CapacitorGeolocation de localizar IONGeolocationLib. DerivedData mantém
      # todos os produtos do grafo no mesmo build tree.
      - name: Build debug .ipa
        working-directory: apps/admin/ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath ./DerivedData \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build \
            | tee build.log
          app_path=./DerivedData/Build/Products/Debug-iphoneos/App.app
          if [ ! -d "$app_path" ]; then
            app_path="$(find ./DerivedData/Build/Products -maxdepth 3 -name App.app -type d -print -quit)"
          fi
          if [ -z "$app_path" ] || [ ! -d "$app_path" ]; then
            echo "::error::App.app não encontrado sob ./DerivedData/Build/Products"
            exit 1
          fi
          echo "App empacotado: $app_path"
          mkdir -p Payload
          cp -R "$app_path" Payload/
          (cd Payload && zip -qry ../MarkMap-debug-ipa.zip .)
          rm -rf Payload

      - name: Upload MarkMap .ipa
        uses: actions/upload-artifact@v4
        with:
          name: markmap-ios-debug
          path: apps/admin/ios/App/MarkMap-debug-ipa.zip
          if-no-files-found: error
          retention-days: 30
